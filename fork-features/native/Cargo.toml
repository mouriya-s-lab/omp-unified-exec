# omp-unified-exec embedded brush shell (fork-features/README.md, "Embedded brush shell").
#
# Copied from can1357/oh-my-pi@c2cb79e4c227aa4b22c4ccb933ff72fd88bceba4
# (`Cargo.toml`, `Cargo.lock`): the members are upstream's eight shell crates
# and its vendored napi, plus `unified-exec-native`, the N-API subset of
# upstream `crates/pi-natives` that this plugin loads. Dependency
# specifications, patches, profiles and lints are upstream's, restricted to
# what these members use.
[workspace]
members = [
   "crates/pi-builtins",
   "crates/pi-iso",
   "crates/pi-shell",
   "crates/pi-vcs",
   "crates/pi-vfs",
   "crates/pi-walker",
   "crates/unified-exec-native",
   "crates/vendor/brush-core",
   "crates/vendor/brush-parser",
   "crates/vendor/napi",
]
resolver = "3"

[workspace.package]
version = "18.11.0"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
homepage = "https://omp.sh/"
repository = "https://github.com/can1357/oh-my-pi"

[patch.crates-io]
brush-core = { path = "crates/vendor/brush-core" }
# brush-parser 0.4.0 (latest release) re-parses `$(...)` bodies without
# here-document awareness; the vendored copy fixes it (see its README.md).
brush-parser = { path = "crates/vendor/brush-parser" }
# napi 3.13.0 pins every `bun test --isolate` realm through per-thread handles
# of never-torn-down envs; the vendored copy releases them (see its README.md).
napi = { path = "crates/vendor/napi" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind (not abort) so panics inside vendored code and native tasks stay
# recoverable at the appropriate boundary: the uutils boundary
# (pi-shell coreutils) turns a panic into a failed command, and the
# `task::blocking` wrapper in `crates/unified-exec-native/src/task.rs` catches
# unwinds inside `Blocking::compute` before they cross napi-rs's async-work
# `extern "C"` callback.
panic = "unwind"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = "symbols"
split-debuginfo = "off"

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
allow_attributes_without_reason = "warn"
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
tuple_array_conversions = "allow"
float_cmp = "allow"
inline_always = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
option_if_let_else = "allow"
enum_glob_use = "allow"
items_after_statements = "allow"
wildcard_imports = "allow"
redundant_pub_crate = "allow"
let_underscore_untyped = "allow"
similar_names = "allow"
unreadable_literal = "allow"
verbose_bit_mask = "allow"
default_trait_access = "allow"
significant_drop_tightening = "allow"
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[workspace.dependencies]
# Internal libraries
pi-iso = { path = "crates/pi-iso" }
pi-shell = { path = "crates/pi-shell" }
pi-vcs = { path = "crates/pi-vcs" }
pi-vfs = { path = "crates/pi-vfs" }
brush-core = { path = "crates/vendor/brush-core" }
brush-parser = { path = "crates/vendor/brush-parser" }
pi-builtins = { path = "crates/pi-builtins" }

# Async runtime & concurrency
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12.5"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
flume = "0.12"

# Serialization & data formats
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2"
bytes = "1"

# CLI & configuration
clap = { version = "4", features = ["derive"] }

# Text processing
regex = "1"
similar = "3.2.0"
xutf = "1.5"

# Collections & hashing
smallvec = { version = "1.16.1", features = ["serde", "write", "union", "const_new"] }
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }

# System & platform
libc = "0.2"
os_pipe = "1"
windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Globalization",
   "Win32_Media_Audio",
   "Win32_Media_Multimedia",
   "Win32_Security",
   "Win32_Storage_FileSystem",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
   "Win32_System_IO",
   "Win32_System_Ioctl",
   "Win32_System_Pipes",
   "Win32_System_Threading",
] }
winreg = "0.56"

# Node.js bindings (N-API)
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"

# Search & file walking
globset = "0.4"
ignore = "0.4"

# Version control (in-process git + jujutsu); see upstream's manifest for the
# shared-gitoxide rationale.
gix = { version = "0.85", default-features = false, features = [
   "attributes",
   "blob-diff",
   "dirwalk",
   "excludes",
   "index",
   "max-performance-safe",
   "merge",
   "revision",
   "sha1",
   "sha256",
   "status",
   "tree-editor",
   "worktree-mutation",
   "zlib-rs",
] }
jj-lib = { version = "0.44", default-features = false, features = ["git"] }
